name: AI Test CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ① 多装一个 pytest-html 插件
      - name: Install dependencies
        run: pip install pyyaml requests pytest pytest-html

      # ② pytest 加两个参数：生成 HTML 报告
      - name: Run pytest
        working-directory: api_auto_demo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pytest cases/test_rag.py -v --html=report.html --self-contained-html

      # ③ 新增一步：把报告上传成 Artifact
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: api_auto_demo/report.html
